<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        font-family: sans-serif;
      }
      #screen {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #header {
        height: 60px;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        background-color: black;
        color: white;
        padding: 0 20px;
      }
      #btn111 {
        width: 100px;
        height: 35px;
        background-color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
      }
      #bellow {
        width: 100%;
        display: flex;
        flex: 1;
        flex-direction: row;
      }
      .box {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 20px;
        transition: flex 0.4s ease, background-color 0.3s ease;
        background-color: red;
      }
      .box:hover {
        flex: 2.5;
      }
      .code {
        width: 100px;
        height: 35px;
        background-color: white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      #footer {
        height: 30px;
        width: 100%;
        background-color: black;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="screen">
      <div id="header">
        <h3>Palatte</h3>
        <button id="btn111">Generate</button>
      </div>

      <div id="bellow">
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
      </div>

      <div id="footer"></div>
    </div>

    <script>
      const Generate = document.getElementById("btn111");
      const boxes = document.querySelectorAll(".box");

      Generate.addEventListener("click", function () {
        boxes.forEach(function (box) {
          const r = Math.floor(Math.random() * 256);
          const g = Math.floor(Math.random() * 256);
          const b = Math.floor(Math.random() * 256);

          box.style.backgroundColor = `rgb(${r},${g},${b})`;

          const toHex = (c) => c.toString(16).padStart(2, "0").toUpperCase();
          const hexCode = `#${toHex(r)}${toHex(g)}${toHex(b)}`;

          box.querySelector(".code").innerText = hexCode;
        });
      });
    </script>
  </body>
</html>
