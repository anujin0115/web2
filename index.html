   <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        height: 100vh;
      }
      #screen {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      #btn111 {
        width: 100px;
        height: 25px;
        background-color: white;
        border-radius: 30px;
        align-items: flex-end;
      }
      #header {
        height: 5%;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        background-color: black;
        padding: 20px;
        align-self: flex-end;
      }
      .box {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s ease;
        background-color: red;
      }
      #bellow {
        width: 100%;
        display: flex;
        flex: 1;
        flex-direction: row;
      }
      .code {
        width: 100px;
        height: 25px;
        background-color: white;
        border-radius: 30px;
      }
      #footer {
        height: 5%;
        width: 100%;
        align-self: flex-end;
        background-color: black;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="screen">
      <div id="header">
        <h3>Palatte</h3>
        <button id="btn111">Generate</button>
      </div>

      <div id="bellow">
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
        <div class="box"><div class="code"></div></div>
      </div>

      <div id="footer"></div>
    </div>
    <script>
      const Generate = document.getElementById("btn111");
      const boxes = document.querySelectorAll(".box");
      const codes = document.querySelectorAll(".code");


      Generate.addEventListener("click", function () {
        boxes.forEach(function (box) {
          const r = Math.floor(Math.random() * 256);
          const g = Math.floor(Math.random() * 256);
          const b = Math.floor(Math.random() * 256);
          const randomRGB = `rgb(${r},${g},${b})`;
          box.style.backgroundColor = randomRGB;
          const rgbToHex = (r, g, b) => {
            const toHex = (channel) => {
              const clamped = Math.max(0, Math.min(255, channel));
              return clamped.toString(16).padStart(2, "0").toUpperCase();
            };
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
          };
          const hexCode = rgbToHex(r, g, b);
          box.querySelector(".code").innerText = hexCode;

        });
      });
    </script>
  </body>
</html>
